services:
  # PostgreSQL Database
  - type: pserv
    name: knowledge-ask-db
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.postgres
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Node.js API
  - type: web
    name: knowledge-ask-api
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-ask-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: CHUNK_SIZE
        value: 600
      - key: CHUNK_OVERLAP
        value: 100
      - key: TOP_K_CHUNKS
        value: 5

databases:
  - name: knowledge-ask-db
    plan: free
    databaseName: knowledge_ask_db
    user: postgres
