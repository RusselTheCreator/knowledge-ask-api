services:
  - type: web
    name: knowledge-ask-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-ask-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: knowledge-ask-db
    databaseName: knowledge_ask_db
    plan: free
