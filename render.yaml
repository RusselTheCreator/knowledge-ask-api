services:
  - type: web
    name: knowledge-ask-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: CHUNK_SIZE
        value: 600
      - key: CHUNK_OVERLAP
        value: 100
      - key: TOP_K_CHUNKS
        value: 5
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-ask-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: knowledge-ask-db
    databaseName: knowledge_ask_db
    plan: free
